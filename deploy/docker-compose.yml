services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ailearning}
      POSTGRES_USER: ${POSTGRES_USER:-ailearning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ailearning} -d ${POSTGRES_DB:-ailearning}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      APP_ENV: production
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ailearning}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ailearning}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in deploy/.env (JSON array)}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ailearning.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
