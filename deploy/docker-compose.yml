# =================================================================
# AiLearning —— 独立 ECS 生产部署（单栈，自建 Caddy）
#
# 与 2026-11-17 共用版的关键差异：
#   * 不再复用 RetroEmuPouch 的 Caddy；nginx 整体删除，改由本栈 caddy 接管 80/443
#   * api 不发布宿主端口；db 只在内网（internal: true）
#   * caddy 同时挂 edge（出网签证书）与 internal（访问 api）
#
# 部署目录：/opt/ailearning-backend
# 资产目录：/opt/ailearning-assets/question_audio（只读，由 rsync 或 OSS 同步）
# =================================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ailearning}
      POSTGRES_USER: ${POSTGRES_USER:-ailearning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ailearning} -d ${POSTGRES_DB:-ailearning}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *default-logging
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ailearning-api:prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ailearning}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ailearning}
      QUESTION_AUDIO_DIR: /app/build/question_audio
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.0.0/16}
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 音频资产不进镜像：宿主只读挂载（首次 rsync，或改 OSS+CDN 后由 caddy 302）
      - ${ASSETS_DIR:-/opt/ailearning-assets}/question_audio:/app/build/question_audio:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging: *default-logging
    networks:
      - internal
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AILEARNING_DOMAIN: ${AILEARNING_DOMAIN:-ailearnning.cn}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    logging: *default-logging
    networks:
      - edge
      - internal

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # 无出网：db 只在这里；api 也在这里被 caddy 访问
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
  # 有出网：caddy 签 ACME 证书、api 访问外部服务
  edge:
    driver: bridge
